<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Slate Navy -->
    <linearGradient id="bg" x1="80" y1="40" x2="1120" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080C14"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    
    <!-- Standard Service Card -->
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    
    <!-- Ingestion Highlight (Amber/Orange) -->
    <linearGradient id="accent-ingest" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>

    <!-- Matching Highlight (Cyan/Emerald) -->
    <linearGradient id="accent-match" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>

    <!-- Routing Engine (Indigo/Violet) -->
    <linearGradient id="accent-route" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Stream Queue (Dark Slate) -->
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#1E293B"/>
      <stop offset="0.5" stop-color="#334155"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>

    <!-- DB Gradient -->
    <linearGradient id="db" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1E293B"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Marker Arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#06B6D4" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981" />
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8B5CF6" />
    </marker>
  </defs>

  <!-- Outer canvas -->
  <rect width="1200" height="630" rx="36" fill="url(#bg)"/>
  <rect x="36" y="36" width="1128" height="558" rx="28" stroke="#1E293B" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="72" y="85" fill="#F8FAFC" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="30" font-weight="800">
    Designing a Ride Aggregator System Architecture
  </text>
  <text x="72" y="116" fill="#94A3B8" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15">
    Real-time driver location ingestion, H3 geospatial indexing, dynamic surge pricing, and A* road-graph routing.
  </text>

  <!-- Top Stats Badge -->
  <rect x="790" y="65" width="338" height="42" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
  <text x="959" y="91" fill="#38BDF8" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    1M+ Drivers | 250k Updates/s | &lt;500ms Matching
  </text>

  <!-- LEVEL 1: INGESTION & PRICING LAYER -->
  <g filter="url(#shadow)">
    <!-- Driver App -->
    <rect x="72" y="160" width="160" height="84" rx="18" fill="url(#card)" stroke="#334155" stroke-width="1.5"/>
    <text x="152" y="193" fill="#F8FAFC" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Driver Apps</text>
    <text x="152" y="213" fill="#94A3B8" font-family="'Inter', system-ui, sans-serif" font-size="12" text-anchor="middle">GPS Updates (4s)</text>
    <text x="152" y="229" fill="#94A3B8" font-family="'Inter', system-ui, sans-serif" font-size="11" text-anchor="middle">gRPC / WebSocket</text>

    <!-- Location Ingestion Gateway -->
    <rect x="272" y="160" width="180" height="84" rx="18" fill="url(#accent-ingest)" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="362" y="193" fill="#0F172A" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="800" text-anchor="middle">Location Ingestion</text>
    <text x="362" y="213" fill="#451A03" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">High-Throughput Gateway</text>
    <text x="362" y="229" fill="#451A03" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Map Matching Filter</text>

    <!-- Kafka Event Stream -->
    <rect x="492" y="160" width="180" height="84" rx="18" fill="url(#stream)" stroke="#475569" stroke-width="1.5"/>
    <text x="582" y="193" fill="#F8FAFC" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Kafka Event Stream</text>
    <text x="582" y="213" fill="#CBD5E1" font-family="'Inter', system-ui, sans-serif" font-size="12" text-anchor="middle">Geo-Partitioned Log</text>
    <text x="582" y="229" fill="#94A3B8" font-family="'Inter', system-ui, sans-serif" font-size="11" text-anchor="middle">Buffer 250k writes/s</text>

    <!-- Rider App -->
    <rect x="712" y="160" width="160" height="84" rx="18" fill="url(#card)" stroke="#334155" stroke-width="1.5"/>
    <text x="792" y="193" fill="#F8FAFC" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Rider App</text>
    <text x="792" y="213" fill="#94A3B8" font-family="'Inter', system-ui, sans-serif" font-size="12" text-anchor="middle">Quote &amp; Book Rides</text>
    <text x="792" y="229" fill="#94A3B8" font-family="'Inter', system-ui, sans-serif" font-size="11" text-anchor="middle">Real-Time Tracking</text>

    <!-- API Gateway -->
    <rect x="912" y="160" width="216" height="84" rx="18" fill="url(#card)" stroke="#334155" stroke-width="1.5"/>
    <text x="1020" y="193" fill="#F8FAFC" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">API Gateway</text>
    <text x="1020" y="213" fill="#94A3B8" font-family="'Inter', system-ui, sans-serif" font-size="12" text-anchor="middle">Auth, Rate Limits, SSL</text>
    <text x="1020" y="229" fill="#94A3B8" font-family="'Inter', system-ui, sans-serif" font-size="11" text-anchor="middle">City-Level Routing</text>
  </g>

  <!-- LEVEL 2: CORE PROCESSING & MATCHING -->
  <g filter="url(#shadow)">
    <!-- Live Geo Index (H3 Cells) -->
    <rect x="72" y="310" width="220" height="92" rx="20" fill="url(#db)" stroke="#06B6D4" stroke-width="1.5"/>
    <text x="182" y="343" fill="#38BDF8" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Live Geo Index</text>
    <text x="182" y="365" fill="#E2E8F0" font-family="'Inter', system-ui, sans-serif" font-size="12" text-anchor="middle">H3 Discrete Spatial Cells</text>
    <text x="182" y="383" fill="#94A3B8" font-family="'Inter', system-ui, sans-serif" font-size="11" text-anchor="middle">In-Memory Active Driver Sets</text>

    <!-- Matching Engine (Accent Highlight) -->
    <rect x="332" y="310" width="240" height="92" rx="20" fill="url(#accent-match)" stroke="#34D399" stroke-width="2"/>
    <text x="452" y="343" fill="#0F172A" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">Matching Engine</text>
    <text x="452" y="365" fill="#064E3B" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Two-Stage Filter &amp; Ranking</text>
    <text x="452" y="383" fill="#064E3B" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Idle + Available-Soon Drivers</text>

    <!-- Routing & ETA Service -->
    <rect x="612" y="310" width="240" height="92" rx="20" fill="url(#accent-route)" stroke="#A78BFA" stroke-width="2"/>
    <text x="732" y="343" fill="#FFFFFF" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">Routing / ETA Engine</text>
    <text x="732" y="365" fill="#EDE9FE" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">A* Search Shortest Path</text>
    <text x="732" y="383" fill="#DDD6FE" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Road Graph + Dynamic Traffic</text>

    <!-- Pricing & Surge Service -->
    <rect x="892" y="310" width="236" height="92" rx="20" fill="url(#card)" stroke="#334155" stroke-width="1.5"/>
    <text x="1010" y="343" fill="#F8FAFC" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Dynamic Pricing Engine</text>
    <text x="1010" y="365" fill="#CBD5E1" font-family="'Inter', system-ui, sans-serif" font-size="12" text-anchor="middle">Rule Engine + Cache</text>
    <text x="1010" y="383" fill="#94A3B8" font-family="'Inter', system-ui, sans-serif" font-size="11" text-anchor="middle">H3 Surge Multiplier f(D/S)</text>
  </g>

  <!-- LEVEL 3: DATA & CONSISTENCY LAYER -->
  <g filter="url(#shadow)">
    <!-- Atomic Driver State & CAS -->
    <rect x="72" y="475" width="240" height="74" rx="16" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <text x="192" y="504" fill="#34D399" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Atomic Driver Reservation</text>
    <text x="192" y="524" fill="#CBD5E1" font-family="'Inter', system-ui, sans-serif" font-size="12" text-anchor="middle">Compare-and-Set (CAS)</text>
    <text x="192" y="539" fill="#94A3B8" font-family="'Inter', system-ui, sans-serif" font-size="11" text-anchor="middle">Strong Consistency / No Double Assign</text>

    <!-- Road Graph In-Memory Topology -->
    <rect x="352" y="475" width="240" height="74" rx="16" fill="#1E293B" stroke="#6366F1" stroke-width="1.5"/>
    <text x="472" y="504" fill="#A5B4FC" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">In-Memory Road Graph</text>
    <text x="472" y="524" fill="#CBD5E1" font-family="'Inter', system-ui, sans-serif" font-size="12" text-anchor="middle">Adjacency List + Live Weights</text>
    <text x="472" y="539" fill="#94A3B8" font-family="'Inter', system-ui, sans-serif" font-size="11" text-anchor="middle">Geographic City Partitions</text>

    <!-- Quote Store & Pricing Rules -->
    <rect x="632" y="475" width="240" height="74" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="752" y="504" fill="#F8FAFC" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Short-Lived Quote Store</text>
    <text x="752" y="524" fill="#CBD5E1" font-family="'Inter', system-ui, sans-serif" font-size="12" text-anchor="middle">Redis Quote TTL (e.g. 5m)</text>
    <text x="752" y="539" fill="#94A3B8" font-family="'Inter', system-ui, sans-serif" font-size="11" text-anchor="middle">Prevents Silent Fare Drift</text>

    <!-- Persistent Relational DB -->
    <rect x="912" y="475" width="216" height="74" rx="16" fill="url(#db)" stroke="#475569" stroke-width="1.5"/>
    <text x="1020" y="504" fill="#F8FAFC" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Transactional DB</text>
    <text x="1020" y="524" fill="#CBD5E1" font-family="'Inter', system-ui, sans-serif" font-size="12" text-anchor="middle">PostgreSQL / Spanner</text>
    <text x="1020" y="539" fill="#94A3B8" font-family="'Inter', system-ui, sans-serif" font-size="11" text-anchor="middle">Rides, Profiles, Completed Trips</text>
  </g>

  <!-- CONNECTORS & PATHS -->
  <!-- Driver -> Ingestion -->
  <path d="M 232 202 H 272" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- Ingestion -> Kafka -->
  <path d="M 452 202 H 492" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- Kafka -> Live Geo Index -->
  <path d="M 582 244 C 582 280, 182 270, 182 310" fill="none" stroke="#06B6D4" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <text x="320" y="278" fill="#06B6D4" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Update Driver Cell</text>

  <!-- Rider -> API Gateway -->
  <path d="M 872 202 H 912" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- API Gateway -> Pricing Service -->
  <path d="M 1020 244 V 310" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1055" y="280" fill="#94A3B8" font-family="'Inter', system-ui, sans-serif" font-size="11">Get Quote</text>

  <!-- API Gateway -> Matching Engine (Book Ride) -->
  <path d="M 970 244 C 970 290, 480 260, 480 310" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <text x="730" y="268" fill="#10B981" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Book Ride (Quote ID)</text>

  <!-- Geo Index -> Matching (Coarse candidates) -->
  <path d="M 292 356 H 332" fill="none" stroke="#06B6D4" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <text x="312" y="348" fill="#06B6D4" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">H3 Ring</text>

  <!-- Matching <-> Routing Service -->
  <path d="M 572 346 H 612" fill="none" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow-violet)"/>
  <path d="M 612 366 H 572" fill="none" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow-violet)"/>
  <text x="592" y="340" fill="#8B5CF6" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">ETA Calc</text>

  <!-- Matching -> Atomic Reservation -->
  <path d="M 410 402 C 410 440, 192 435, 192 475" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <text x="270" y="440" fill="#10B981" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Atomic CAS Dispatch</text>

  <!-- Routing -> In-Memory Graph -->
  <path d="M 700 402 C 700 440, 472 435, 472 475" fill="none" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow-violet)"/>

  <!-- Pricing -> Short-Lived Quote Store -->
  <path d="M 960 402 C 960 440, 752 435, 752 475" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Matching -> Transactional DB (Confirmed Ride) -->
  <path d="M 550 402 C 550 460, 950 440, 950 475" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
